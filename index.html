<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTM Diff Viewer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Microsoft Threat Modeling Tool</p>
        <h1>MTM Diff Viewer</h1>
      </div>
      <div class="summary" aria-live="polite">
        <span><strong id="addedCount">0</strong> added threats</span>
        <span><strong id="removedCount">0</strong> removed threats</span>
        <span><strong id="changedCount">0</strong> changed threats</span>
        <span><strong id="unchangedCount">0</strong> unchanged threats</span>
      </div>
    </header>

    <main class="app-shell">
      <section class="input-panel" aria-label="Model files">
        <label class="drop-zone" id="baseDrop">
          <input id="baseFile" type="file" accept=".tm7,.json,.xml,.txt">
          <span class="file-role">Base</span>
          <strong id="baseName">Drop or choose a model</strong>
          <small>Older revision</small>
        </label>
        <label class="drop-zone" id="targetDrop">
          <input id="targetFile" type="file" accept=".tm7,.json,.xml,.txt">
          <span class="file-role">Target</span>
          <strong id="targetName">Drop or choose a model</strong>
          <small>Newer revision</small>
        </label>
      </section>

      <section class="toolbar" aria-label="Diff controls">
        <div class="segmented" role="group" aria-label="Diff filter">
          <button class="active" data-filter="all" type="button">All</button>
          <button data-filter="added" type="button">Added</button>
          <button data-filter="removed" type="button">Removed</button>
          <button data-filter="changed" type="button">Changed</button>
          <button data-filter="unchanged" type="button">Unchanged</button>
        </div>
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Threat id, title, state">
        </label>
      </section>

      <section class="content">
        <aside class="diff-list" aria-label="Diff results">
          <div class="list-meta" id="listMeta">0 threats</div>
          <div id="emptyState" class="empty-state">
            <strong>Select two model files</strong>
            <span>Threat changes will appear here after both files are loaded.</span>
          </div>
          <ol id="diffList"></ol>
        </aside>

        <section class="details" aria-label="Diff details">
          <div id="detailsEmpty" class="empty-state">
            <strong>No change selected</strong>
            <span>Choose a threat to inspect old and new values.</span>
          </div>
          <article id="detailsPanel" hidden>
            <div class="details-head">
              <span id="detailsStatus" class="status-pill"></span>
              <div>
                <h2 id="detailsTitle"></h2>
                <p id="detailsPath"></p>
              </div>
            </div>
            <div id="propertyDiffs" class="property-diffs"></div>
          </article>
        </section>
      </section>
    </main>

    <template id="propertyRowTemplate">
      <div class="property-row">
        <div class="property-key"></div>
        <pre class="before"></pre>
        <pre class="after"></pre>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
